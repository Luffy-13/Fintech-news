name: Daily Fintech News Bot

# Trigger schedule: every day at 00:30 UTC → 6:00 AM IST
on:
  schedule:
    - cron: '30 0 * * *'  # 00:30 UTC is 6:00 AM IST
  workflow_dispatch:  # Allow manual runs

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      # Step 4: Run the Fintech News script
      - name: Run fintech news script
        run: |
          python fintech_news_bot.py  # Make sure your script is saved with this name in repo
